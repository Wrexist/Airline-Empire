name: Launch safety
on:
  workflow_call:
    inputs:
      candidate_sha:
        type: string
        required: true
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: launch-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    container: swift:6.0.3-jammy
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: Full simulation regression suite
        working-directory: AirlineEmpireCore
        run: swift test -c release
      - name: Release source checks
        run: python3 scripts/check-release-readiness.py
  app:
    runs-on: macos-26
    # iOS 26.4's StoreKit test service returned SKInternalErrorDomain 3
    # before loading any product (run 34164974444). Keep this test lane on
    # the installed 26.2 runtime; normal CI still compiles with current Xcode.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: Generate project
        working-directory: AirlineEmpireApp
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Select iPhone simulator
        id: sim
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next(d["udid"] for r,ds in json.load(sys.stdin)["devices"].items() if r.endswith("iOS-26-2") for d in ds if d.get("isAvailable") and d["name"].startswith("iPhone")))')
          echo "id=$DEVICE" >> "$GITHUB_OUTPUT"
      - name: App save safety and real StoreKit tests
        working-directory: AirlineEmpireApp
        run: |
          xcodebuild test -project AirlineEmpire.xcodeproj -scheme AirlineEmpire \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.id }}' \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 1200 \
            -maximum-test-execution-time-allowance 1200 \
            -parallel-testing-enabled NO -only-testing:AirlineEmpireTests \
            -only-testing:AirlineEmpireUITests/FreeTierUITests \
            -only-testing:AirlineEmpireUITests/MapHomeUITests/testTheMapIsTheHomeScreen \
            CODE_SIGNING_ALLOWED=NO -resultBundlePath LaunchSafety.xcresult
      - name: Export genuine paywall review screenshots
        run: python3 scripts/export-iap-review.py AirlineEmpireApp/LaunchSafety.xcresult iap-review
      - uses: actions/upload-artifact@v4
        with:
          name: iap-review-screenshots
          path: iap-review/
          retention-days: 45
      - name: Release build ignores test entitlement overrides
        working-directory: AirlineEmpireApp
        run: |
          xcodebuild test -project AirlineEmpire.xcodeproj -scheme AirlineEmpire \
            -configuration Release ENABLE_TESTABILITY=YES \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.id }}' \
            -parallel-testing-enabled NO \
            -only-testing:AirlineEmpireTests/LaunchSafetyTests/testUnrelatedUITestFlagsDoNotGrantPro \
            CODE_SIGNING_ALLOWED=NO -resultBundlePath ReleaseSafety.xcresult
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-safety-results
          path: |
            AirlineEmpireApp/LaunchSafety.xcresult
            AirlineEmpireApp/ReleaseSafety.xcresult
          retention-days: 45
      - name: UI checkpoints in the log
        if: always()
        run: python3 scripts/export-ci-checkpoints.py AirlineEmpireApp/LaunchSafety.xcresult
