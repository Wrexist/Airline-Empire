name: App Store metadata

# The store listing — name, subtitle, keywords, description, screenshots — from
# `store/` to App Store Connect.
#
# ## Two very different things happen in this file
#
#   · On every pull request that touches store/, the listing is VALIDATED.
#     Offline, no secrets, seconds. This is the check that catches a
#     101-character keyword field before anyone is waiting on a release.
#
#   · On workflow_dispatch, the listing is PLANNED or APPLIED. Applying writes
#     to a public product page, so it needs three separate acts of intent: a
#     manual dispatch, mode=apply, and the word APPLY typed into a confirmation
#     box. A plan run is the default and prints the exact before/after for
#     every field it would change.
#
# Nothing here deletes anything, and nothing here submits the app for review.
# Submission stays a deliberate human action in App Store Connect — see
# docs/RELEASE_PIPELINE.md for where the line is and why it is there.

# No `pull_request:` trigger, deliberately. `ci.yml`'s release-tooling job
# already runs the selftest, the listing validation, the fill-in-sheet
# freshness check and the bundle-config check on EVERY pull request — a
# superset of what this file's validate job was doing on the subset of PRs
# that touch store/. Two jobs running the same checks is two jobs to pay for
# and two places to keep in step; the duplicate is the one that goes.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App Store version to push the listing into (e.g. 1.0.0)'
        type: string
        required: true
      mode:
        description: 'plan prints what would change; apply writes it to App Store Connect'
        type: choice
        options: [plan, apply]
        default: plan
      confirm:
        description: 'Type APPLY to confirm a write. Ignored for a plan.'
        type: string
        default: ''
      screenshots:
        description: 'Also upload store/screenshots (replaces the existing sets)'
        type: boolean
        default: false
      screenshots_only:
        description: 'Update screenshots only; preserve all other listing metadata'
        type: boolean
        default: false
      urls_only:
        description: 'Update support, marketing and privacy URLs only'
        type: boolean
        default: false
      review_images:
        description: 'Only plan or fill the three prepared purchase review images'
        type: boolean
        default: false
      submit_for_review:
        description: 'App Review submission: plan reads it, attach adds the app version to the open submission, submit also sends it to Apple'
        type: choice
        options: [off, plan, attach, submit]
        default: off

concurrency:
  # One writer at a time. Two concurrent pushes to the same listing would
  # interleave PATCHes and leave a page nobody wrote.
  group: app-store-metadata
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crash-audit:
    name: Read existing beta crash diagnostics
    if: inputs.mode == 'plan' && !inputs.review_images && !inputs.screenshots_only && !inputs.urls_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch technical crash evidence
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          node scripts/asc/audit-beta-crashes.mjs
          node scripts/asc/audit-territories.mjs
      # What App Review actually has: the review submission and the items in it.
      # Guideline 2.1(b) is a fact about the submission, not about the products.
      - name: Read the review submission
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: node scripts/asc/audit-review-submission.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: apple-beta-crash-audit
          path: apple-audit/
          retention-days: 45
  # Kept for dispatch runs only, where it does something CI cannot: validation
  # WITHOUT --allow-placeholders, so a listing still containing REPLACE_ME
  # never reaches Apple.
  validate:
    name: Validate the listing (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Release tooling selftest
        run: node scripts/asc/selftest.mjs

      - name: Fill-in sheet is current
        run: node scripts/asc/build-fill-in-sheet.mjs --check

      # Strict: no --allow-placeholders. This run can reach Apple.
      - name: Validate
        run: node scripts/asc/validate-metadata.mjs

  push:
    # A static name. An expression here is not evaluated for the check-run
    # title on a pull_request event — where `inputs` does not exist — so the
    # checks list showed the raw `${{ … }}` source as the check's name. The
    # mode is already visible in the run's own summary and in every step.
    name: Push to App Store Connect (plan or apply)
    needs: validate
    if: github.event_name == 'workflow_dispatch' && !inputs.review_images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The typed confirmation is not ceremony: `mode` is a dropdown, and a
      # dropdown is one mis-click away from rewriting a live product page.
      - name: Check the confirmation
        if: inputs.mode == 'apply'
        run: |
          if [ "${{ inputs.confirm }}" != "APPLY" ]; then
            echo "::error::mode=apply requires the confirm box to contain exactly APPLY."
            exit 1
          fi

      - name: Require secrets
        run: |
          missing=()
          [ -n "$APP_STORE_CONNECT_KEY_ID" ] || missing+=("APP_STORE_CONNECT_KEY_ID")
          [ -n "$APP_STORE_CONNECT_ISSUER_ID" ] || missing+=("APP_STORE_CONNECT_ISSUER_ID")
          [ -n "$APP_STORE_CONNECT_API_KEY_BASE64" ] || missing+=("APP_STORE_CONNECT_API_KEY_BASE64")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secret(s): ${missing[*]} — see docs/APP_STORE_CONNECT.md."
            exit 1
          fi

      # Submitting locks the version: Apple refuses metadata edits on a version
      # in review ("Version 1.0 is READY_FOR_REVIEW and does not accept metadata
      # edits"). Pushing and submitting in the same dispatch therefore has to be
      # sequenced, not raced - metadata first, then the submission - and a
      # submit-only dispatch skips this step instead of going red for a refusal
      # that is correct.
      - name: Push metadata
        if: '!inputs.screenshots_only && !inputs.urls_only && inputs.submit_for_review != ''submit'''
        run: |
          node scripts/asc/push-metadata.mjs \
            --version "${{ inputs.version }}" \
            ${{ inputs.mode == 'apply' && '--apply' || '' }}

      # --replace is implied by an apply run: a listing that is the source of
      # truth cannot half-replace a screenshot set, and leaving the old shots
      # beside the new ones is the one outcome nobody wants.
      - name: Push screenshots
        if: inputs.screenshots || inputs.screenshots_only
        run: |
          node scripts/asc/upload-screenshots.mjs \
            --version "${{ inputs.version }}" \
            ${{ inputs.mode == 'apply' && '--apply --replace' || '' }}

      - name: Update website links only
        if: inputs.urls_only
        env:
          STORE_VERSION: ${{ inputs.version }}
          URL_MODE: ${{ inputs.mode }}
        run: |
          node scripts/asc/update-website-urls.mjs --version "$STORE_VERSION" ${{ inputs.mode == 'apply' && '--apply' || '' }}

      - uses: actions/upload-artifact@v4
        if: always() && inputs.urls_only
        with:
          name: website-url-verification
          path: apple-audit/website-urls.json
          retention-days: 45

      - name: Verify screenshot checksums, order and processing
        if: (inputs.screenshots || inputs.screenshots_only) && inputs.mode == 'apply'
        env:
          STORE_VERSION: ${{ inputs.version }}
        run: node scripts/asc/verify-screenshots.mjs --version "$STORE_VERSION"

      - uses: actions/upload-artifact@v4
        if: always() && (inputs.screenshots || inputs.screenshots_only)
        with:
          name: screenshot-upload-verification
          path: apple-audit/screenshots.json
          retention-days: 45

      - name: What happens next
        if: inputs.mode == 'apply'
        run: |
          echo "::notice::The listing is written. Nothing has been submitted for review."
          echo "Attach a build and submit from App Store Connect when the release is ready."

  # Guideline 2.1(b): App Review rejected 1.0 because the three Pro products were
  # not in the submission. The products are READY_TO_SUBMIT with complete review
  # images; what is missing is the app version in the same submission. This job
  # is off by default and refuses to be reached by accident.
  submit-review:
    if: inputs.submit_for_review != 'off'
    # After `push`, deliberately: metadata must land before the version is
    # submitted, because submitting locks it.
    needs: [validate, push]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Attach the version, and submit when asked
        run: |
          FLAGS=""
          if [ "${{ inputs.submit_for_review }}" = "attach" ] || [ "${{ inputs.submit_for_review }}" = "submit" ]; then
            FLAGS="--apply"
          fi
          if [ "${{ inputs.submit_for_review }}" = "submit" ]; then
            FLAGS="$FLAGS --submit"
          fi
          node scripts/asc/submit-for-review.mjs --version "${{ inputs.version }}" $FLAGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-submission-report
          path: apple-audit/submit-for-review.json
          retention-days: 45

  purchase-review-images:
    if: inputs.review_images
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the prepared review assets
        run: node scripts/asc/upload-iap-review.mjs --check
      - name: Plan or fill missing purchase review images
        env:
          REVIEW_MODE: ${{ inputs.mode }}
          REVIEW_CONFIRM: ${{ inputs.confirm }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          if [ "$REVIEW_MODE" = "apply" ]; then
            test "$REVIEW_CONFIRM" = "APPLY"
            node scripts/asc/upload-iap-review.mjs --apply
          else
            node scripts/asc/upload-iap-review.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purchase-review-image-report
          path: apple-audit/iap-review.json
          retention-days: 45
