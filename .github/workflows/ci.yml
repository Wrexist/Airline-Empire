name: CI

# The gate. Three questions, each answered on the cheapest machine that can
# answer it:
#
#   1. Does the simulation core build and pass its 253 tests?  (ubuntu, 1x)
#   2. Is the release tooling sound and the store listing legal? (ubuntu, 1x)
#   3. Does the SwiftUI app actually COMPILE?                    (macOS, 10x)
#
# Question 3 is the one this repository has never been able to answer. Every
# session so far has run on Linux, where the Apple SDKs do not exist, so
# `AirlineEmpireApp` is "authored, parsed, structurally validated, never
# compiled" (docs/APPLE_VALIDATION.md). A macOS runner can answer it in about
# ten minutes without anyone owning a Mac — which is the single highest-value
# thing this file does. It is scoped by a `git diff` rather than run on every
# commit, because macOS minutes bill at ten times ubuntu ones and a docs-only
# change cannot break a compile.

on:
  # Docs-only pushes to main do not need a compiler. This filter is safe
  # *here* and deliberately absent from `pull_request` below: GitHub reports
  # no status at all for a workflow a paths filter skipped, and this file's
  # own rule (see "What changed?" in the app job) is that a check which
  # silently does not run is a check that never blocks anything. On a PR the
  # gate is a job that runs and decides; on a push to main there is nothing
  # to block, so the workflow can simply not start.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tasks/**'
      - '.gitignore'
      - 'LICENSE'
      - 'store/**'
  # Only PRs that target main. A PR between two feature branches is somebody
  # staging work, not asking for the gate.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: >-
          compile is what a pull request gets (~2 min: does it build);
          smoke adds the eight-test subset a merge to main gets (~10 min);
          full runs every journey class and the performance measurements on
          four runners. Full is what you want before a release or after
          touching the map, the shell or the campaign.
        type: choice
        options: [compile, smoke, full]
        default: full
      ipad:
        description: >-
          Also run the shell journey on an iPad simulator (regular width).
          Off by default: it is a second macOS job at 10x billing, and the
          layout it photographs changes far less often than the code does.
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 1 · The simulation core, on Linux ──────────────────────────────────────
  core:
    name: Core (swift build + test)
    runs-on: ubuntu-latest
    # The official image, pinned to the toolchain every result in
    # docs/APPLE_VALIDATION.md §7 was measured with. `scripts/setup-linux-
    # toolchain.sh` exists for sandboxes where download.swift.org is blocked;
    # a GitHub runner has no such problem, so the container is simpler and
    # reproducible.
    container: swift:6.0.3-jammy
    # MEASURED, not chosen: the debug suite took 26 min 34 s (run 130) and
    # 27 min 01 s (run 131) at 450 tests, and 29 min 12 s at 451 in run 132
    # after AE-041's fix left the rivals holding the routes they used to
    # close (a 5% larger ten-year world). At 30 the release build that
    # follows was cancelled with every test green. Forty-five leaves the
    # step room to grow and still fails a hung run inside the hour.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: AirlineEmpireCore
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # Most of a `swift test` run is compilation, not assertions: measured at
      # 7m30s cold (run 33215272439) for 253 tests that are pure computation.
      # SwiftPM does its own dependency tracking, so a restored `.build` turns
      # the usual case into an incremental compile.
      #
      # The key pins the toolchain and the manifest; `restore-keys` deliberately
      # falls back to the newest cache for the same toolchain when sources have
      # changed, which is the case that matters — a source edit should recompile
      # one module, not the package. A stale cache cannot produce a false green:
      # SwiftPM recompiles what changed, and the key changes with the toolchain.
      - name: Restore the SwiftPM build cache
        uses: actions/cache@v4
        with:
          path: |
            AirlineEmpireCore/.build
            /root/.cache/org.swift.swiftpm
          key: swiftpm-6.0.3-${{ hashFiles('AirlineEmpireCore/Package.swift') }}-${{ hashFiles('AirlineEmpireCore/Sources/**/*.swift', 'AirlineEmpireCore/Tests/**/*.swift') }}
          restore-keys: |
            swiftpm-6.0.3-${{ hashFiles('AirlineEmpireCore/Package.swift') }}-
            swiftpm-6.0.3-

      # The same reasoning as the macOS job below, applied to the 1x runner:
      # a commit that touches only docs or the store listing cannot break the
      # simulation, and this job is nine minutes of it. Expressed as a step so
      # the job still reports a status on every pull request.
      - name: What changed?
        id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "test=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" "${{ github.sha }}" | grep -Eq '^(AirlineEmpireCore/|\.github/workflows/ci\.yml$)'; then
            echo "test=true" >> "$GITHUB_OUTPUT"
          else
            echo "test=false" >> "$GITHUB_OUTPUT"
            echo "No changes under AirlineEmpireCore — skipping the suite."
          fi

      - name: Swift version
        if: steps.changes.outputs.test == 'true'
        run: swift --version

      # Debug first: the per-tick integrity assertion that catches state
      # corruption is compiled out in release, so a release-only run would
      # skip the strongest check the suite has.
      - name: Test (debug)
        if: steps.changes.outputs.test == 'true'
        run: swift test

      # Release is what ships, and Swift 6 strict concurrency diagnostics
      # differ between configurations. `-warnings-as-errors` holds the
      # "target: zero new warnings" line in docs/APPLE_VALIDATION.md §2 to
      # something a machine enforces rather than something a human remembers.
      - name: Build (release, warnings are errors)
        if: steps.changes.outputs.test == 'true'
        run: swift build -c release -Xswiftc -warnings-as-errors

  # ── 2 · Release tooling and the store listing ──────────────────────────────
  release-tooling:
    name: Release tooling (selftest + listing)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Node is preinstalled on the runner image; this pins the major version
      # so a runner-image bump cannot change what the release tooling runs on.
      # Nothing is installed — scripts/asc has no dependencies by design.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 30 tests: the App Store Connect JWT (including the DER-vs-raw
      # signature trap that produces a silent 401), the HTTP client's paging
      # and retry rules, PNG alpha detection, and the listing validator
      # against deliberate mistakes.
      - name: Release tooling selftest
        run: node scripts/asc/selftest.mjs

      # --allow-placeholders: REPLACE_ME in the review contact is a warning
      # here and an error in the release workflow. The listing is complete and
      # reviewable before anyone owns an Apple Developer account; what it must
      # not do is reach Apple in that state. See scripts/asc/lib/metadata.mjs.
      - name: Validate store listing
        run: node scripts/asc/validate-metadata.mjs --allow-placeholders

      # docs/APP_STORE_CONNECT_FILL_IN.md is generated from store/ and is what
      # a human actually pastes into App Store Connect. If it drifts from the
      # copy the pipeline pushes, the wrong version is the one that reaches the
      # store — so a stale sheet fails here rather than at a keyboard.
      - name: Fill-in sheet is current
        run: node scripts/asc/build-fill-in-sheet.mjs --check

      # The bundle rules Apple enforces at upload, read off project.yml. Run
      # 33216345773 archived, signed and exported before Apple refused it over
      # an Info.plist key that had been committed for hours; this is that
      # rejection moved onto the 1x runner, where it costs seconds.
      - name: Bundle configuration
        run: node scripts/asc/check-bundle-config.mjs

      # Two questions `swiftc -parse` — the only compiler check a Linux session
      # has — cannot answer, both of which have since cost a 10x-billed build.
      # Does every AE type and ae modifier the app uses exist? An edit that
      # deleted four declarations from Components.swift passed every local
      # check and reported 29 "cannot find X in scope" on the runner. And is a
      # key path being passed where an element is wanted? `contains(\.flag)`
      # parses and reads like the `filter(\.flag)` used a dozen places here,
      # but only `filter` takes a predicate; that one killed three simulator
      # shards. Both are answerable by reading the sources, on the cheap
      # runner, in milliseconds.
      - name: App symbols and key paths resolve
        run: node scripts/check-app-symbols.mjs

      # A sound cue with no file is the one audio bug that reports itself as
      # working: nothing throws, nothing logs, the moment simply passes in
      # silence. Checked against Core's own `AudioCue.assetName`, on the cheap
      # runner, in milliseconds (docs/AUDIO_ARCHITECTURE.md §10).
      - name: Audio assets resolve
        run: python3 scripts/audio/check-assets.py

  # ── 0 · What the macOS runners should do, decided on Linux ─────────────────
  #
  # macOS bills at 10x. Every decision about whether to spend those minutes,
  # and on what, is made here on a 1x runner that finishes in seconds.
  #
  # Two questions:
  #
  #   Should the app be built at all?  Answered by diffing against **the last
  #   commit CI was green on for this branch**, not against the pull request's
  #   base. Diffing the base means that once a pull request touches
  #   `AirlineEmpireApp/`, every later push re-runs the whole macOS suite
  #   forever — including pushes that change only markdown. That is what
  #   happened on 2026-09-06: a commit touching one file under `tasks/`
  #   spent ~90 macOS minutes. Diffing the last *green* head is both cheaper
  #   and safer than diffing the last push: a change whose run was cancelled
  #   by `concurrency` is still in the diff, because that run never went
  #   green.
  #
  #   Which journeys?  The subset on a pull request, everything on demand.
  #   See the matrix below for what is in the subset and why.
  plan:
    name: Plan the macOS work
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      matrix: ${{ steps.decide.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The diff below needs history: a shallow clone has no base commit.
          fetch-depth: 0

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SUITE_INPUT: ${{ inputs.suite }}
        run: |
          set -euo pipefail

          # ── which suite ──────────────────────────────────────────────────
          #
          # Signal per macOS minute, which is the only currency that matters
          # at 10x billing:
          #
          #   compile  ~2 min   Does the SwiftUI app build? This repository
          #                     could never answer that on Linux — the Apple
          #                     SDKs do not exist there — and it is the
          #                     failure this file was created to catch. Run
          #                     134 was exactly this: three shards, all three
          #                     dead in 76-113 s on one line in DashboardView.
          #                     `build-for-testing` is 56 s; the other eight
          #                     minutes of a smoke run are simulator boot and
          #                     journeys.
          #   smoke   ~10 min   ...plus eight journeys. On a merge to main,
          #                     where a red build is expensive to discover
          #                     late.
          #   full    ~40 min   ...plus every journey class and the
          #                     performance baselines, on four runners. On
          #                     demand.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            SUITE="${SUITE_INPUT:-full}"
          elif [ "$EVENT" = "push" ]; then
            SUITE=smoke
          else
            SUITE=compile
          fi
          echo "Suite: $SUITE"

          # ── should macOS run at all ──────────────────────────────────────
          BASE=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Dispatched by hand — building unconditionally."
          else
            LAST_GREEN=$(curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/runs?branch=${BRANCH}&status=success&per_page=1" \
              | jq -r '.workflow_runs[0].head_sha // empty') || LAST_GREEN=""
            if [ -n "$LAST_GREEN" ] \
               && git cat-file -e "${LAST_GREEN}^{commit}" 2>/dev/null \
               && git merge-base --is-ancestor "$LAST_GREEN" "$HEAD_SHA"; then
              BASE="$LAST_GREEN"
              echo "Diffing against the last green head on ${BRANCH}: $BASE"
            elif [ "$EVENT" = "pull_request" ] && [ -n "$PR_BASE" ]; then
              BASE="$PR_BASE"
              echo "No usable green head — diffing against the pull request base: $BASE"
            elif [ -n "$PUSH_BEFORE" ]; then
              BASE="$PUSH_BEFORE"
              echo "No usable green head — diffing against the previous push: $BASE"
            fi
          fi

          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BUILD=true
            echo "No usable base commit — building."
          else
            CHANGED=$(git diff --name-only "$BASE" "$HEAD_SHA")
            echo "$CHANGED"
            if printf '%s\n' "$CHANGED" \
               | grep -Eq '^(AirlineEmpireApp/|AirlineEmpireCore/|\.github/workflows/ci\.yml$)'; then
              BUILD=true
            else
              BUILD=false
              echo "No app, core or workflow changes since the last green run — no macOS minutes needed."
            fi
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

          # ── the matrix ───────────────────────────────────────────────────
          #
          # The subset is chosen by value per second, from the per-test costs
          # measured on run 158 (seconds, on a normal runner):
          #
          #   founding reaches every tab           29.1   dead links, five tabs
          #   home guides to a first aircraft      13.8   the next step exists
          #   audio cues all decode                18.6   asset integrity
          #   no screen shows the old glyph        27.5   a cross-screen contract
          #   acquire an aircraft, open a route   140.8   THE core loop
          #   section picker is not in dead space  20.4   a frame assertion
          #   selecting an airport opens a panel   32.6   the map answers a tap
          #   the clock actually runs              63.2   the simulation moves
          #                                       ─────
          #                                       346.1   ≈ 6 min of tests
          #
          # ~9 minutes of runner once the build, the boot and the install are
          # counted; ~15 on the slowest machine measured (runners vary 1.7x,
          # see the UI step's cap). Three classes, one runner, no cloning.
          #
          # What a pull request no longer gets, and gets on `full`: the era
          # campaign (611 s), the New York advice campaign (355 s), the month
          # statement (203 s), the Munich arrival (579 s), both appearances,
          # dynamic type, the follow camera, and the performance baselines.
          SMOKE=""
          for T in \
            CampaignUITests/testFoundingAnAirlineReachesEveryTab \
            CampaignUITests/testHomeGuidesANewPlayerToTheirFirstAircraft \
            CampaignUITests/testAudioEngineStartsAndEveryCueDecodes \
            EconomyJourneyUITests/testNoScreenShowsTheOldCurrencyGlyph \
            EconomyJourneyUITests/testAcquireAircraftThenOpenARoute \
            ShellAndMapUITests/testSectionPickerSitsUnderTheNavigationBarNotInDeadSpace \
            ShellAndMapUITests/testSelectingAnAirportOpensItsPanel \
            ShellAndMapUITests/testTheClockActuallyRuns
          do
            SMOKE="$SMOKE -only-testing:AirlineEmpireUITests/$T"
          done

          case "$SUITE" in
            full)
              MATRIX=$(jq -cn '{include: [
                {shard: 1, name: "campaign",   job: 45, ui: 40, run: true, measure: false,
                 tests: "-only-testing:AirlineEmpireUITests/CampaignUITests"},
                {shard: 2, name: "economy",    job: 45, ui: 40, run: true, measure: false,
                 tests: "-only-testing:AirlineEmpireUITests/EconomyJourneyUITests"},
                {shard: 3, name: "shell + map", job: 60, ui: 40, run: true, measure: true,
                 tests: "-only-testing:AirlineEmpireUITests/ShellAndMapUITests"},
                {shard: 4, name: "arrival",    job: 45, ui: 40, run: true, measure: false,
                 tests: "-only-testing:AirlineEmpireUITests/HorizonArrivalUITests"}
              ]}') ;;
            smoke)
              MATRIX=$(jq -cn --arg tests "$SMOKE" '{include: [
                {shard: 0, name: "smoke", job: 25, ui: 18, run: true, measure: false,
                 tests: $tests}
              ]}') ;;
            *)
              # No simulator is booted, no test bundle is run, and none of
              # the evidence steps fire: this job answers one question and
              # stops. It is why a pull request now costs about two macOS
              # minutes instead of eighty-four.
              MATRIX=$(jq -cn '{include: [
                {shard: 0, name: "compile", job: 15, ui: 1, run: false, measure: false,
                 tests: ""}
              ]}') ;;
          esac
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "$MATRIX" | jq .

  # ── 3 · Does the app compile? ──────────────────────────────────────────────
  app:
    name: iOS app (xcodebuild) · ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-26
    # One class to a runner, and **no simulator cloning anywhere**.
    #
    # Four measurements got it here. Run 123: XCUITest distributes by test
    # class and put three classes on one cloned simulator (39 minutes) while
    # the fourth finished on the other and left it idle for 25 — the
    # imbalance, not the total work, was most of the 48 minutes. Run 125:
    # asking for three parallel workers put three simulators on a three-core
    # runner, two test runners died before connecting ("Timed out waiting for
    # AX loaded notification") and seven journeys failed on starvation. Run
    # 126, two named shards of two classes each: the shard with ten
    # launch-heavy tests across two clones starved anyway.
    #
    # Run 162 removed the last exception, "the pair that already proved
    # itself". The diff was one markdown file and the same app code had
    # passed every journey forty minutes earlier, but the second clone's
    # test runner never came up —
    #
    #     Simulator device failed to launch
    #     com.airlineempire.AirlineEmpireUITests.xctrunner.
    #     (FBSOpenApplicationServiceErrorDomain Code=1)
    #
    # — so both suites piled onto Clone 1 and two journeys died of
    # starvation: "Failed to get matching snapshots: Timed out while
    # evaluating UI query", and a stepper tap that did not register. Neither
    # is an assertion about the app. Asking a degraded runner for a second
    # simulator is what turns a slow machine into a red build.
    #
    # The matrix comes from the `plan` job above: one smoke shard on a pull
    # request, four class shards on a dispatched `full` run.
    timeout-minutes: ${{ matrix.job }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # No `fetch-depth: 0` and no change detection here any more: the
      # `plan` job answered both questions on a 1x runner, and this job does
      # not start at all when the answer was no.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Xcode version
        run: xcodebuild -version

      # project.yml is the source of truth; the .xcodeproj is generated and
      # git-ignored. That is decision D-002's shape carried into CI: there is
      # no checked-in Xcode project that can drift from the manifest.
      - name: Generate the Xcode project
        working-directory: AirlineEmpireApp
        run: |
          brew install xcodegen
          xcodegen generate

      # No signing: this answers "does it compile", not "can it ship".
      # Signing needs credentials and belongs to ios-testflight.yml.
      # `build-for-testing`, not `build`: it produces the test bundles and
      # the runner as well as the app. Plain `build` left them to be
      # compiled inside the `test` invocation, which is why the measurement
      # pass below spent nine minutes running two minutes of tests — and why
      # splitting the suite into two passes would otherwise have paid that
      # compile twice.
      - name: Build for the simulator
        working-directory: AirlineEmpireApp
        run: |
          set -o pipefail
          xcodebuild \
            -project AirlineEmpire.xcodeproj \
            -scheme AirlineEmpire \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      # The step that actually runs the app.
      #
      # `generic/platform=iOS Simulator` above compiles without booting
      # anything, which is why four phases of interface work reached "it
      # compiles" and stopped there. This boots a concrete device and drives
      # the first minute of the game: found an airline, reach every tab, open
      # the market. It is the only check in the project that would catch a
      # control that exists, compiles, and does nothing — the shape of
      # BUG-029, BUG-030 and BUG-032, all three found by hand.
      #
      # The device is resolved rather than named. Runner images change their
      # installed simulators without warning, and a hardcoded 'iPhone 16'
      # turns that into a red build with a confusing message.
      - name: Pick a simulator
        id: sim
        if: matrix.run
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available --json \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          best = None
          for runtime, devices in data.items():
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if not device.get('isAvailable'):
                      continue
                  name = device['name']
                  if name.startswith('iPhone'):
                      # Prefer a plain iPhone over Pro/Max/mini: the smallest
                      # common phone is the layout most likely to reveal a
                      # cramped row, and this project has never seen one.
                      score = (0 if 'Pro' in name or 'Max' in name else 1, name)
                      if best is None or score > best[0]:
                          best = (score, name)
          print(best[1] if best else '')
          ")
          if [ -z "$NAME" ]; then
            echo 'No available iOS simulator on this runner.' >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # Two passes, on purpose.
      #
      # XCUITest distributes work by test *class*, so the whole suite in one
      # class ran strictly serially — twenty-six minutes of one simulator
      # while the runner's other cores sat idle. The suite is now four
      # classes, and the second pass runs three of them on cloned simulators
      # at once.
      #
      # The measurements do not join that party. Map rebuild/replay counts
      # and cold launch are the only numbers this project treats as evidence,
      # and a figure taken while three other simulators fight for the same
      # cores is not comparable with the ones already in
      # docs/MAP_P0_PERFORMANCE_REPORT.md. They run first, alone, on an
      # otherwise quiet machine.
      - name: Measure (alone, so the numbers stay comparable)
        if: matrix.measure
        working-directory: AirlineEmpireApp
        run: |
          set -o pipefail
          xcodebuild \
            -project AirlineEmpire.xcodeproj \
            -scheme AirlineEmpire \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -only-testing:AirlineEmpireUITests/PerformanceBaselineUITests \
            -parallel-testing-enabled NO \
            -resultBundlePath UITestResults-baseline.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building 2>&1 | tee ui-test-output.txt

      - name: Run the UI tests
        if: always() && matrix.run
        working-directory: AirlineEmpireApp
        # A step timeout, not only the job's: when this overruns, the step
        # fails and the evidence steps below still run on the result bundle
        # as it stands. Run 118 lost every frame of a new journey to the job
        # cap instead.
        #
        # The cap comes from the matrix: 18 minutes for the smoke subset
        # (~6 min of tests) and 40 for a full class shard (longest measured
        # 19.6 min).
        #
        # Both are sized against a *measured* spread between runners, not a
        # guess. Runs 158 and 160 ran byte-identical UI test code; the
        # measurement pass, which runs the same two tests alone and serially
        # on both, took 150.5 s on run 158 and 249.5 s on run 160 — the same
        # work, 1.66× slower, and 263.2 s on run 162, the slowest seen. A cap
        # under ~1.75× of the normal time loses green suites to the machine
        # they were scheduled on, which is exactly how run 160 died at 30
        # minutes.
        timeout-minutes: ${{ matrix.ui }}
        run: |
          set -o pipefail
          xcodebuild \
            -project AirlineEmpire.xcodeproj \
            -scheme AirlineEmpire \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            ${{ matrix.tests }} \
            -parallel-testing-enabled NO \
            -resultBundlePath UITestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building 2>&1 | tee -a ui-test-output.txt

      # The failure messages. xcodebuild's log names the test that failed
      # and how long it took, and nothing else; the assertion text — which
      # query, which screen, the message the test was written with — lives
      # only in the result bundle. Runs 113 and 114 each ended a journey on
      # an assertion nobody could read from the log. Evidence, not a gate.
      - name: Failure messages into the log
        if: always() && matrix.run
        working-directory: AirlineEmpireApp
        continue-on-error: true
        run: |
          set +e
          for BUNDLE in UITestResults.xcresult UITestResults-baseline.xcresult; do
            [ -d "$BUNDLE" ] || continue
            echo "=== $BUNDLE ==="
            xcrun xcresulttool get test-results summary --path "$BUNDLE" 2>/dev/null \
              | python3 -c '
          import json, sys
          summary = json.load(sys.stdin)
          failures = summary.get("testFailures") or []
          if not failures:
              print("no test failures recorded")
          for failure in failures:
              print("--- " + str(failure.get("testName")))
              print(str(failure.get("failureText")).strip())
          ' || echo "summary unavailable"
          done

      # The screenshots. These are the only visual evidence this project has
      # ever produced, so they are kept whether the run passed or failed —
      # a green run whose screens are wrong is precisely the case that needs
      # looking at.
      # Only when something failed, and only for three days.
      #
      # These bundles are ~30 MB each. Uploading them on `always()` for
      # fourteen days is what produced 1,990 GB-hrs of Actions storage in a
      # week — about 91 MB per run, three runs an hour on a busy day, held a
      # fortnight. The success case loses nothing: the step below prints
      # every frame into the log as base64, which is where they are actually
      # read from (see its comment). What an artifact adds over that is
      # full resolution, and full resolution only matters when you are
      # looking at a failure.
      - name: Keep the screenshots
        if: failure() && matrix.run
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-shard${{ matrix.shard }}
          path: |
            AirlineEmpireApp/UITestResults.xcresult
            AirlineEmpireApp/UITestResults-baseline.xcresult
          retention-days: 3
          if-no-files-found: warn

      # Print the screenshots into the log, small, as base64.
      #
      # This looks eccentric and is deliberate. The artifact above is the
      # right home for full-resolution screens and is what a human should
      # open. But an artifact can only be fetched by something holding a
      # GitHub credential, and the agent doing the UI work in this repository
      # reads job logs and cannot download artifacts — so without this step
      # the screens remain, once again, unobserved by whoever is changing
      # them. Four phases of "authored, not observed" were caused by exactly
      # that kind of gap between where evidence lands and who needs it.
      #
      # Downscaled hard (360 px wide) because the question being answered is
      # "is the hierarchy right, is anything clipped, does it look like one
      # app" — all legible at thumbnail size — and a full-resolution frame
      # would flood the log. `|| true` throughout: this is evidence, not a
      # gate, and it must never be the reason a green run reports red.
      - name: Screenshots into the log
        if: always() && matrix.run
        working-directory: AirlineEmpireApp
        continue-on-error: true
        run: |
          set +e
          OUT=$(mktemp -d)
          # Both passes leave a bundle; the exporter writes one manifest per
          # output directory, so each is exported into its own subdirectory
          # and the reader below walks all of them.
          for BUNDLE in UITestResults.xcresult UITestResults-baseline.xcresult; do
            [ -d "$BUNDLE" ] || continue
            SUB="$OUT/$(basename "$BUNDLE" .xcresult)"
            mkdir -p "$SUB"
            xcrun xcresulttool export attachments \
              --path "$BUNDLE" --output-path "$SUB" >/dev/null 2>&1
          done
          # The exporter writes a manifest plus files whose names are uuids;
          # the manifest carries the human name each attachment was given.
          python3 - "$OUT" <<'PYEOF'
          import base64, json, os, subprocess, sys
          out = sys.argv[1]
          pairs = []
          for root, _dirs, files in os.walk(out):
              if "manifest.json" not in files:
                  continue
              for suite in json.load(open(os.path.join(root, "manifest.json"))):
                  for a in suite.get("attachments", []):
                      name = a.get("suggestedHumanReadableName") or a.get("exportedFileName")
                      path = os.path.join(root, a.get("exportedFileName", ""))
                      if name and os.path.exists(path):
                          pairs.append((name, path))
          if not pairs:
              print("NO-ATTACHMENTS-EXPORTED")
              sys.exit(0)
          # Only checkpoints. The log carries ~200 lines per screen, so an
          # unbounded set silently pushes the earliest images past any
          # practical `tail` — and the earliest are the journey's opening
          # steps, which are the ones worth seeing (TD-020). Everything is
          # still in the artifact; this bounds only what is printed.
          pairs = [(n, p) for n, p in pairs if n.startswith("KEY-")]
          if not pairs:
              print("NO-CHECKPOINT-ATTACHMENTS (nothing named KEY-*)")
              sys.exit(0)
          print(f"CHECKPOINTS: {len(pairs)}")
          seen = set()
          for name, path in sorted(pairs):
              if name in seen:
                  continue
              seen.add(name)
              small = path + ".small.png"
              subprocess.run(["sips", "--resampleWidth", "360", path,
                              "--out", small],
                             capture_output=True)
              use = small if os.path.exists(small) else path
              data = base64.b64encode(open(use, "rb").read()).decode()
              print(f"===SHOT {name} {len(data)}")
              for i in range(0, len(data), 500):
                  print(data[i:i+500])
              print("===ENDSHOT")
          PYEOF
          exit 0

      # The same failures again, at the very bottom of the log.
      #
      # Not redundancy — ordering. The step above prints roughly 200 lines per
      # screenshot, so on a run with a dozen checkpoints the test results are
      # thousands of lines above the end of the log, and a `tail` large enough
      # to reach them returns megabytes of base64 with the answer buried in it.
      # That is how AE-032's two failures took four log fetches to identify.
      # Fifteen lines here puts the verdict where anyone, human or agent,
      # looks first.
      - name: What failed
        if: always() && matrix.run
        working-directory: AirlineEmpireApp
        continue-on-error: true
        run: |
          if [ ! -f ui-test-output.txt ]; then
            echo "No UI test output captured."
            exit 0
          fi
          echo "=== UI TEST RESULTS ==="
          # Both spellings. xcodebuild prints "Test Case '-[…]' passed
          # (1.2 seconds)." when tests run serially and "Test case '-[…]'
          # passed on 'Clone 1 of iPhone 16' (1.2 seconds)." when they run in
          # parallel — lower-case, and with the clone between the verdict and
          # the duration. The old pattern demanded "(" right after the
          # verdict, so the shard that used to run ten journeys across two
          # clones never listed a single one of them here: its summary showed
          # only the two measurement tests, which run serially. The job was
          # still gated correctly on xcodebuild's exit code — this was the
          # evidence missing, not the gate. Nothing is cloned any more, so
          # every line should be the first spelling; the second stays because
          # the pattern should not depend on that remaining true.
          grep -E "Test [Cc]ase .* (passed|failed)" ui-test-output.txt || true
          echo "=== FAILURES ==="
          grep -E "^.*: error: -\[" ui-test-output.txt | head -40 || true
          # Up to two passes, so up to two totals: the measurement pass
          # (full runs only) and the journeys.
          grep -E "Executed [0-9]+ tests?," ui-test-output.txt | tail -2 || true

  # ── 4 · The same shell, at regular width ───────────────────────────────────
  #
  # Opt-in via the workflow_dispatch input above. The iPhone job answers "does
  # the game work"; this one answers only "what does the shell look like when
  # the width class is regular" — a question that had literally never been
  # answered before this job existed. Two tests, not the suite: the five tabs
  # and the detail screens are the whole of what regular width can change.
  app-ipad:
    name: iPad shell (regular width)
    if: github.event_name == 'workflow_dispatch' && inputs.ipad
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate the Xcode project
        working-directory: AirlineEmpireApp
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick an iPad simulator
        id: sim
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available --json \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          best = None
          for runtime, devices in data.items():
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if not device.get('isAvailable'):
                      continue
                  name = device['name']
                  if name.startswith('iPad'):
                      # Prefer a plain iPad; any regular-width canvas answers
                      # the question this job asks.
                      score = (0 if 'Pro' in name or 'mini' in name else 1, name)
                      if best is None or score > best[0]:
                          best = (score, name)
          print(best[1] if best else '')
          ")
          if [ -z "$NAME" ]; then
            echo 'No available iPad simulator on this runner.' >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Run the shell journey on the iPad
        working-directory: AirlineEmpireApp
        run: |
          set -o pipefail
          xcodebuild \
            -project AirlineEmpire.xcodeproj \
            -scheme AirlineEmpire \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath UITestResults.xcresult \
            -only-testing:AirlineEmpireUITests/CampaignUITests/testFoundingAnAirlineReachesEveryTab \
            -only-testing:AirlineEmpireUITests/ShellAndMapUITests/testDetailScreensAndSettingsRender \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee ui-test-output.txt

      # Failures only, three days — same reasoning as the phone job above.
      - name: Keep the screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-ipad
          path: AirlineEmpireApp/UITestResults.xcresult
          retention-days: 3
          if-no-files-found: warn

      # Identical to the iPhone job's step, for the identical reason: the
      # agent that needs these images can read logs and cannot fetch
      # artifacts.
      - name: Screenshots into the log
        if: always()
        working-directory: AirlineEmpireApp
        continue-on-error: true
        run: |
          set +e
          OUT=$(mktemp -d)
          xcrun xcresulttool export attachments \
            --path UITestResults.xcresult --output-path "$OUT" >/dev/null 2>&1
          python3 - "$OUT" <<'PYEOF'
          import base64, json, os, subprocess, sys
          out = sys.argv[1]
          manifest = os.path.join(out, "manifest.json")
          pairs = []
          if os.path.exists(manifest):
              for suite in json.load(open(manifest)):
                  for a in suite.get("attachments", []):
                      name = a.get("suggestedHumanReadableName") or a.get("exportedFileName")
                      path = os.path.join(out, a.get("exportedFileName", ""))
                      if name and os.path.exists(path):
                          pairs.append((name, path))
          if not pairs:
              print("NO-ATTACHMENTS-EXPORTED")
              sys.exit(0)
          pairs = [(n, p) for n, p in pairs if n.startswith("KEY-")]
          if not pairs:
              print("NO-CHECKPOINT-ATTACHMENTS (nothing named KEY-*)")
              sys.exit(0)
          print(f"CHECKPOINTS: {len(pairs)}")
          seen = set()
          for name, path in sorted(pairs):
              if name in seen:
                  continue
              seen.add(name)
              small = path + ".small.png"
              subprocess.run(["sips", "--resampleWidth", "360", path,
                              "--out", small],
                             capture_output=True)
              use = small if os.path.exists(small) else path
              data = base64.b64encode(open(use, "rb").read()).decode()
              print(f"===SHOT {name} {len(data)}")
              for i in range(0, len(data), 500):
                  print(data[i:i+500])
              print("===ENDSHOT")
          PYEOF
          exit 0

      - name: What failed
        if: always()
        working-directory: AirlineEmpireApp
        continue-on-error: true
        run: |
          if [ ! -f ui-test-output.txt ]; then
            echo "No UI test output captured."
            exit 0
          fi
          echo "=== UI TEST RESULTS ==="
          # Both spellings. xcodebuild prints "Test Case '-[…]' passed
          # (1.2 seconds)." when tests run serially and "Test case '-[…]'
          # passed on 'Clone 1 of iPhone 16' (1.2 seconds)." when they run in
          # parallel — lower-case, and with the clone between the verdict and
          # the duration. The old pattern demanded "(" right after the
          # verdict, so the shard that used to run ten journeys across two
          # clones never listed a single one of them here: its summary showed
          # only the two measurement tests, which run serially. The job was
          # still gated correctly on xcodebuild's exit code — this was the
          # evidence missing, not the gate. Nothing is cloned any more, so
          # every line should be the first spelling; the second stays because
          # the pattern should not depend on that remaining true.
          grep -E "Test [Cc]ase .* (passed|failed)" ui-test-output.txt || true
          echo "=== FAILURES ==="
          grep -E "^.*: error: -\[" ui-test-output.txt | head -40 || true
          grep -E "Executed [0-9]+ tests?," ui-test-output.txt | tail -1 || true
