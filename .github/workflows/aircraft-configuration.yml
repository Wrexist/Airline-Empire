name: Aircraft configuration validation
on:
  workflow_dispatch:
  push:
    branches: [codex/ae049-aircraft-configuration]
    paths:
      - AirlineEmpireApp/**
      - AirlineEmpireCore/**
      - .github/workflows/aircraft-configuration.yml
permissions:
  contents: read
concurrency:
  group: aircraft-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    container: swift:6.0.3-jammy
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Core regression tests
        working-directory: AirlineEmpireCore
        run: swift test --filter 'AircraftConfigurationTests|ServiceDemandTests|DemandTests|ReputationTests|FleetTests|RouteManagementTests|FlightOpsTests|PersistenceTests|SaveStoreTests'
      - name: Release build
        working-directory: AirlineEmpireCore
        run: swift build -c release -Xswiftc -warnings-as-errors
  native:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: |
          mkdir -p build
          brew install xcodegen
          cd AirlineEmpireApp
          xcodegen generate
      - name: Build iOS app and tests
        working-directory: AirlineEmpireApp
        run: xcodebuild -project AirlineEmpire.xcodeproj -scheme AirlineEmpire -destination 'generic/platform=iOS Simulator' -derivedDataPath ../build/ae049 ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build-for-testing > ../build/ae049-build.log 2>&1
      - name: Select simulator
        id: simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']
          supported = [ds for runtime, ds in devices.items() if 'iOS-26-2' in runtime] or list(devices.values())
          phone = next(d for ds in supported for d in ds if d['name'].startswith('iPhone'))
          tablet = next(d for ds in supported for d in ds if d['name'].startswith('iPad'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f: f.write('id=' + phone['udid'] + '\nipad=' + tablet['udid'] + '\n')
          PY
      - name: Aircraft screen journeys
        working-directory: AirlineEmpireApp
        run: xcodebuild -project AirlineEmpire.xcodeproj -scheme AirlineEmpire -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' -derivedDataPath ../build/ae049 -resultBundlePath ../build/ae049-ui.xcresult -only-testing:AirlineEmpireUITests/AircraftConfigurationUITests -only-testing:AirlineEmpireTests/AccessibilitySurfaceReviewTests/testAircraftConfigurationAtAccessibleSizes -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test-without-building > ../build/ae049-ui.log 2>&1
      - name: iPad aircraft journey
        working-directory: AirlineEmpireApp
        run: xcodebuild -project AirlineEmpire.xcodeproj -scheme AirlineEmpire -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.ipad }}' -derivedDataPath ../build/ae049 -resultBundlePath ../build/ae049-ipad.xcresult -only-testing:AirlineEmpireUITests/AircraftConfigurationUITests/testCabinEditingAndUpgradeNavigationDark -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test-without-building > ../build/ae049-ipad.log 2>&1
      - name: Export screenshots
        if: always()
        run: |
          for device in ui ipad; do
            if [ -d "build/ae049-$device.xcresult" ]; then
              xcrun xcresulttool export attachments --path "build/ae049-$device.xcresult" --output-path "build/ae049-$device-screens"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aircraft-validation
          path: |
            build/ae049-build.log
            build/ae049-ui.log
            build/ae049-ui.xcresult
            build/ae049-ipad.log
            build/ae049-ipad.xcresult
            build/ae049-*-screens
