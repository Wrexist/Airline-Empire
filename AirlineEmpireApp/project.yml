# XcodeGen manifest — generate the Xcode project on macOS with:
#   brew install xcodegen && xcodegen generate
#
# The .xcodeproj is generated and git-ignored: this file is the source of
# truth, and CI regenerates the project on every run (.github/workflows/ci.yml,
# .github/workflows/ios-testflight.yml) so the two can never disagree.
name: AirlineEmpire
options:
  bundleIdPrefix: com.airlineempire
  deploymentTarget:
    iOS: "17.0"
packages:
  AirlineEmpireCore:
    path: ../AirlineEmpireCore
targets:
  AirlineEmpire:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Apple reads the privacy manifest out of the app bundle; it has to be a
      # resource, not a compiled source, and XcodeGen will not guess that from
      # the extension.
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      # The sound palette. Declared as a plain source path (not a folder
      # reference) so XcodeGen makes a group and the .wav files land flat in
      # the bundle — which is what `Bundle.main.url(forResource:withExtension:)`
      # in AudioEngine expects. A folder reference would put them in a
      # subdirectory and every lookup would return nil, silently
      # (docs/AUDIO_ARCHITECTURE.md §10).
      - path: Resources/Audio
        buildPhase: resources
    dependencies:
      - package: AirlineEmpireCore
    settings:
      base:
        # INFOPLIST_KEY_* below require the Xcode-generated Info.plist.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # The generated launch screen is a blank white field, which is a poor
        # use of the first second of every session and a hard flash into a
        # dark first screen (docs/UIUX_FORENSIC_AUDIT.md UI-033). Painting it
        # the onboarding's own dusk means the app appears to fade up out of
        # its own sky. The colour lives in the asset catalogue so it is one
        # value, not two.
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: LaunchBackground
        # Orientations are declared PER DEVICE, and the iPad list must contain
        # all four. Apple rejected upload run 33216345773 with error 90474:
        #
        #   Invalid bundle. The "…Portrait,…LandscapeLeft,…LandscapeRight"
        #   orientations were provided … but you need to include all of the
        #   "…Portrait,…PortraitUpsideDown,…LandscapeLeft,…LandscapeRight"
        #   orientations to support iPad multitasking.
        #
        # It is a consequence of TARGETED_DEVICE_FAMILY "1,2" below: shipping an
        # iPad build opts into Slide Over and Split View, and an iPad app that
        # refuses one orientation cannot be tiled beside another app. The one
        # alternative — UIRequiresFullScreen: YES — buys the old list back by
        # opting out of multitasking entirely, which is worse for a game whose
        # own pitch is that it fits into five minutes beside something else.
        #
        # The iPhone list deliberately stays three-wide: upside-down portrait on
        # a phone is a mis-rotation, not a feature, and no iPhone since the X
        # supports it anyway.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Airline Empire

        # The bundle identifier is pinned rather than derived from
        # bundleIdPrefix + target name, because it is the key App Store Connect
        # matches an app record on and it must equal store/config.json's
        # `bundleId` exactly. Deriving it means renaming the target silently
        # renames the app.
        PRODUCT_BUNDLE_IDENTIFIER: com.airlineempire.game

        # Defaults for a local build. The release workflow overrides both on
        # the xcodebuild command line: the marketing version from its input,
        # the build number from App Store Connect's highest + 1
        # (scripts/asc/next-build-number.mjs).
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1

        # The app contains no encryption beyond what Apple exempts (it makes no
        # network calls at all). Declaring it here means every upload skips the
        # export-compliance questionnaire instead of stopping for a human.
        # Its absence is what turns each TestFlight build into a manual step.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

        # Shows up on the Mac App Store and in Finder metadata; harmless on
        # iOS and free to be correct. Matches the GAMES_SIMULATION primary
        # subcategory in store/config.json.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.simulation-games

        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

        # Signing is deliberately not pinned here. A local build uses
        # automatic signing with whatever team the developer is logged into;
        # the release workflow passes DEVELOPMENT_TEAM, CODE_SIGN_STYLE and
        # the profile explicitly. Pinning a team id in the manifest would make
        # the project unbuildable for anyone else.

  # The first target in this project that runs the app rather than compiling
  # it. Four phases of interface work have been reported as "authored, not
  # observed" because nothing existed to observe them with, and three defects
  # of the same shape — a control that exists, compiles and does nothing —
  # were found by hand instead (BUG-029, BUG-030, BUG-032). A
  # `NavigationLink(value:)` with no matching destination is silently inert;
  # only tapping it finds that out.
  #
  # UI tests, not unit tests: the untested seam is the app talking to itself
  # through SwiftUI's navigation and presentation, which a unit test cannot
  # reach. `tasks/TECH_DEBT.md` TD-016 asks for both; this is the half that
  # catches the bugs actually being found.
  AirlineEmpireUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: AirlineEmpire
    settings:
      base:
        TEST_TARGET_NAME: AirlineEmpire
        # A UI test bundle is code-signed even on a simulator unless told
        # otherwise, and the runner has no team.
        CODE_SIGNING_ALLOWED: NO

# XcodeGen does not generate a shared scheme unless one is declared, and Xcode
# only autocreates schemes when a human opens the project. `xcodebuild -scheme
# AirlineEmpire` on a runner would fail with "scheme not found" — which is a
# confusing way to lose a 10x-billed job — so the scheme is declared here and
# committed as part of the manifest.
schemes:
  AirlineEmpire:
    build:
      targets:
        AirlineEmpire: all
        AirlineEmpireUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # Screenshots are attached on every step, not only on failure — the
      # question this target was added to answer is "what does it look like",
      # and a failure-only attachment never answers it.
      targets:
        - AirlineEmpireUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
